; =====================================================================
;  NewsRoll.ini — настройки новостного скрипта NewsRoll.qml («Форвард Т»)
;
;  Файл лежит рядом с NewsRoll.qml и перечитывается вместе с данными
;  новостей каждые reloadIntervalMs — правки применяются без перезапуска.
;
;  ПРАВИЛА:
;   • «ключ = значение»; ПУСТОЕ значение — берётся значение из QML;
;   • пояснение пишется ПОСЛЕ значения и отделяется « ; »
;     (пробел — точка с запятой — пробел); всё после него игнорируется;
;   • строки, начинающиеся с «;», и заголовки «[...]» — комментарии;
;   • true/false можно писать как 1/0, да/нет, on/off;
;   • цвета — #RRGGBB или #AARRGGBB (AA — прозрачность);
;   • пути — только с прямыми слэшами: file:///D:/Project/newsroll/…
; =====================================================================

[файлы и времена]

; ФОРМУЛА ВРЕМЕНИ (слот страницы — от её появления до следующей, переход ВКЛЮЧЁН):
;   одно СМИ = showTimeFirstMs + (страниц-1) x showTimeRestMs
;   полный цикл = заставка + сумма по всем страницам
;   пример: 3 СМИ по 5 строк (2 страницы), 9000/9000, заставка 3000:
;           цикл = 3000 + 3 x (9000+9000) = 57000 мс = 0:57 РОВНО
;   точную цифру скрипт печатает в консоль при каждом выходе в эфир;
;   окно titleon в расписании ставьте РАВНЫМ циклу (при большем окне
;   цикл повторится с заставки посреди окна)

newsFileUrl =          ; файл новостей ; напр. file:///D:/Project/newsroll/пикалево.txt
showTimeFirstMs = 9000 ; СЛОТ первой страницы блока (3 предложения), мс
showTimeRestMs = 9000  ; СЛОТ следующих страниц (2-3 предложения), мс
splashDurationMs =     ; СТАТИЧЕСКАЯ заставка, мс ; 0 = выключить, вкл. ограничение 3000..8000
splashText =           ; СВОЙ текст заставки вместо «НОВОСТИ» ; напр. НОВОСТИ ПИКАЛЁВО
splashTextColor =      ; цвет текста заставки ; по умолчанию белый
splashLogoUrl =        ; логотип на заставке (картинка вместо пульсирующего кольца) ; напр. file:///D:/Project/Forward_T/logo.png
splashBackgroundUrl =  ; фоновая картинка заставки (тёмно-синий цвет остаётся подложкой) ; напр. file:///D:/Project/Forward_T/bg.jpg
introVideoUrl =        ; ВИДЕО-заставка в начале показа (приоритет над статической) ; напр. file:///D:/Project/Forward_T/intro.mp4 ; пусто — статическая
introVideoVolume =     ; громкость видео-заставки 0..1 ; по умолчанию 1
airRestartGuardMs =    ; подавление рестартов после старта показа, мс (защита подготовки клипа в моде «Файл») ; по умолчанию 15000

[смена страниц]

showDebugOverlay =      ; индикатор в правом нижнем углу: живое состояние страницы и длительность цикла ; true/false ; по умолчанию ВКЛЮЧЁН — поставьте false, чтобы скрыть
transitionStyle =      ; эффект смены страниц: flip (переворот), slideLeft, slideRight, slideUp, slideDown
transitionDurationMs = ; длительность эффекта смены, мс ; напр. 700
headerSwapMs =         ; скорость смены заголовка «#...», мс ; напр. 300
loopPlayback =         ; показ по кругу ; true/false ; по умолчанию false — после последней страницы показ ЗАВЕРШАЕТСЯ и элемент паркуется на заставке к следующему включению
sentencesOnFirstPage = ; предложений на первой странице блока ; по умолчанию 3
sentencesOnNextPage =  ; предложений на следующих страницах блока ; по умолчанию 3
reloadIntervalMs =     ; период перечитывания новостей и этого ini, мс ; напр. 300000 (5 мин), 0 = выключить
useInjectedTask =      ; брать текст из свойства контекста движка вместо файла ; true/false ; по умолчанию false — не включайте без проверки: пробы имён нагружают движок FDOnAir

[оформление]

fontFamily =           ; шрифт всех надписей ; напр. Arial
enableOutline =        ; обводка текста для читаемости на видео ; true/false
panelColor =           ; фон панели (полупрозрачный) ; по умолчанию #B3202740
panelBorderColor =     ; рамка панели ; по умолчанию #FF3D6DA6
headerBgColor =        ; фон полосы заголовка ; по умолчанию #FF16406B
headerTextColor =      ; цвет заголовка «#...» ; по умолчанию белый
textColor =            ; цвет строк новостей ; по умолчанию #FFF4F4F4
accentColor =          ; акцент: полоса у заголовка, кольцо заставки ; по умолчанию #FFE2543B
errorColor =           ; сообщения об ошибках ; по умолчанию #FFFF6A4D
outlineColor =         ; цвет обводки текста ; по умолчанию #CC101010
